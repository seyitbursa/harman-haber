name: GitHub Models testi
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Katalog
        run: curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://models.github.ai/catalog/models | head -c 1500
      - name: Çıkarım
        run: |
          curl -s -w "\nHTTP %{http_code}\n" -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Tek kelimeyle: Türkiye başkenti?"}],"max_tokens":10}' | head -c 1500
