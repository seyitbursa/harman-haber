name: Haberleri güncelle ve yayınla

on:
  schedule:
    - cron: "*/15 * * * *"   # ~15 dakikada bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Kalıcı regresyon testleri (yanlış konu eşleşmesi, birleştirme): başarısızsa yayın yapılmaz
      - run: node scripts/test.mjs
      - run: node scripts/fetch.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      # Stil, betik ve oyun kodunu sürümlü ayrı dosyalara böl (tekrar ziyarette yeniden indirilmez)
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
