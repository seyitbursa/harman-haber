name: Harman Haber X yayını
on:
  push:
    branches: [main]
    paths: ['data/x-approved/*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harman-x-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python -m pip install requests-oauthlib==2.0.0
      - name: Verify account and publish approved item
        env:
          X_OAUTH: ${{ secrets.X_OAUTH }}
          BRAND_ID: ${{ vars.X_BRAND_USER_ID }}
        run: |
          python scripts/x_publish.py
